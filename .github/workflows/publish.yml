# Publish @almasix/sonar via npm Trusted Publishing (OIDC).
#
# Prerequisites (one-time on npmjs.com):
#   Package → Settings → Trusted Publisher → GitHub Actions
#   Organization: almasix-dev
#   Repository:   almasix-sonar
#   Workflow:     publish.yml   ← filename only, must match this file
#   Allowed:      npm publish
#
# Release: bump package.json version, commit, tag vX.Y.Z, push the tag.

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache on release builds (npm trusted-publishing guidance).
          package-manager-cache: false

      - name: Verify npm CLI (OIDC needs ≥ 11.5.1)
        run: |
          npm --version
          node --version

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install, build, and test
        run: |
          npm ci
          npm run build
          npm test

      # No NPM_TOKEN / NODE_AUTH_TOKEN — OIDC trusted publishing authenticates publish.
      - name: Publish to npm
        run: npm publish --access public
