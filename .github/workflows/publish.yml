name: Publish

# Cutting a release: publish a GitHub Release on a vX.Y.Z tag.
# Rehearsing: Actions → Publish → Run workflow → dry_run: true.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only (skip npm publish)
        type: boolean
        default: true
      version:
        description: Version without v prefix (workflow_dispatch only; release uses tag)
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
            if [ -z "$RAW" ]; then
              RAW=$(node -p "require('./package.json').version")
            fi
          fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Align package version
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(j, null, 2) + '\n');
          "
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Pack tarball
        run: npm pack

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" almasix-sonar-*.tgz --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almasix-sonar-${{ steps.ver.outputs.version }}
          path: almasix-sonar-*.tgz

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set" >&2
            exit 1
          fi
          npm publish --access public
